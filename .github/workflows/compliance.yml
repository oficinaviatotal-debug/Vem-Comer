name: Compliance (registro de obrigações legais)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  registro-de-obrigacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir o registro (cada obrigação precisa de controle e de prova que exista)
        run: python3 compliance/check.py
      - name: Painel por produto
        run: python3 compliance/check.py --painel >> "$GITHUB_STEP_SUMMARY"
      - name: Testes do conferidor e do vigia da lei
        run: python3 -B -m unittest discover -s compliance -p 'test_*.py' -v

  banco-de-verdade:
    # Prova no PostgreSQL de verdade: o esquema e todas as migrações aplicam do zero (como o instalador faz),
    # aplicam de novo sem erro, e as regras que dependem do banco (registro de aceites que só recebe linhas
    # novas, lista de bloqueio, limites de envio, pedidos do titular com a anonimização que preserva o dinheiro
    # e o inventário de dados que confere cada coluna pessoal) passam.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: vc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: teste
      VEM_TEST_DATABASE_URL: host=localhost port=5432 user=postgres password=teste dbname=vc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar as dependências do servidor
        run: pip install -r backend/requirements.txt
      - name: Aplicar o esquema e as migrações como o instalador faz
        run: |
          set -e
          grep -vE '^\\(un)?restrict ' database/schema.production.sql | psql -h localhost -U postgres -v ON_ERROR_STOP=1 -1 vc >/dev/null
          for passada in 1 2; do
            for arq in database/migrations/*.sql; do
              case "$(basename "$arq")" in 001_*) continue ;; esac
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 vc <"$arq" >/dev/null
            done
          done
      - name: Testes que dependem do banco
        working-directory: backend
        run: python3 -B -m unittest test_conformidade_db test_inventario_dados test_titular_db -v
