name: Vem Comer front-end logic tests

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "tests/onboarding/**"
      - "tests/customer/**"
      - "tests/ui/**"
      - "tests/assistant/**"
      - "tests/costs/**"
      - "tests/business/**"
      - "tests/mesa/**"
      - "tests/nav/**"
      - "tests/signup/**"
      - "tests/logo/**"
      - "tests/courier/**"
      - "tests/push/**"
      - ".github/workflows/frontend-logic.yml"
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  frontend-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 22 runs TypeScript files directly, so the guide's logic and the
      # tour script are tested without installing anything.
      - name: Run front-end logic tests (guide, customer cart and tracking, menu assistant, costs, business panel, table calls, side menu and start screen, signup, logo, courier, push notifications, formatting, links, assets, contrast)
        run: node --experimental-strip-types --no-warnings --test tests/onboarding/*.test.mjs tests/customer/*.test.mjs tests/ui/*.test.mjs tests/assistant/*.test.mjs tests/costs/*.test.mjs tests/business/*.test.mjs tests/mesa/*.test.mjs tests/nav/*.test.mjs tests/signup/*.test.mjs tests/logo/*.test.mjs tests/courier/*.test.mjs tests/push/*.test.mjs
