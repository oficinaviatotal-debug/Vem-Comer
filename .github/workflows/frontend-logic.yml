name: Vem Comer front-end logic tests

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "tests/onboarding/**"
      - "tests/ui/**"
      - ".github/workflows/frontend-logic.yml"
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  frontend-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 22 runs TypeScript files directly, so the guide's logic and the
      # tour script are tested without installing anything.
      - name: Run front-end logic tests (guide, formatting, links, assets, contrast)
        run: node --experimental-strip-types --no-warnings --test tests/onboarding/*.test.mjs tests/ui/*.test.mjs
